name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase is connected
        id: ready
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ] || [ ! -f .env.production ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT secret or .env.production missing, deploy skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$SA" > sa.json
            echo "project=$(grep VITE_FIREBASE_PROJECT_ID .env.production | cut -d= -f2)" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - if: steps.ready.outputs.ok == 'true'
        run: npx vitest run
      - if: steps.ready.outputs.ok == 'true'
        run: npm run build
      - if: steps.ready.outputs.ok == 'true'
        run: npx firebase deploy --only firestore:rules,hosting --project "${{ steps.ready.outputs.project }}" --non-interactive
      - if: steps.ready.outputs.ok == 'true'
        run: node scripts/bootstrap-admin.mjs "${{ steps.ready.outputs.project }}"
      - if: always()
        run: rm -f sa.json
